<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面展示已暂停 - Lisselde_E</title>
    <meta name="description" content="本站的页面展示已暂停，更新与资源文件保持原样。">
    <meta name="robots" content="noindex">
    <link rel="icon" href="assets/images/icon/me.ico" type="image/x-icon">
    <style>
        :root {
            --bg: #fbfbf9;
            --text: #1a1a1a;
            --muted: #6b6b6b;
            --line: #e3e3df;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #121212;
                --text: #e9e9e6;
                --muted: #8f8f8b;
                --line: #2b2b2b;
            }
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                "Hiragino Sans GB", "Microsoft YaHei", Helvetica, Arial, sans-serif;
            font-size: 16px;
            line-height: 1.75;
            -webkit-font-smoothing: antialiased;
        }

        .wrap {
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
            padding: 0 24px;
        }

        .site-header {
            padding-top: 44px;
            font-size: 13px;
            letter-spacing: 0.08em;
            color: var(--muted);
        }

        main {
            padding-top: 52px;
            padding-bottom: 44px;
        }

        h1 {
            margin: 0 0 18px;
            font-family: Georgia, "Songti SC", "Noto Serif SC", "Times New Roman", serif;
            font-size: 30px;
            font-weight: 600;
            line-height: 1.4;
        }

        p {
            margin: 0;
            color: var(--muted);
        }

        .en {
            margin-top: 36px;
            padding-top: 20px;
            border-top: 1px solid var(--line);
            font-size: 15px;
        }

        footer {
            padding-top: 18px;
            padding-bottom: 40px;
            border-top: 1px solid var(--line);
            font-size: 13px;
            color: var(--muted);
        }

        footer a {
            color: var(--muted);
            text-decoration: none;
            border-bottom: 1px solid var(--line);
        }

        footer a:hover {
            color: var(--text);
            border-color: var(--text);
        }

        @media (max-width: 480px) {
            .site-header {
                padding-top: 32px;
            }

            main {
                padding-top: 36px;
            }

            h1 {
                font-size: 25px;
            }
        }
    </style>
</head>
<body>
    <div class="wrap site-header">站点公告</div>
    <main class="wrap">
        <h1>页面展示已暂停</h1>
        <p>本站的详细展示页面暂时关闭</p>

        <p class="en" lang="en">Page display is paused.</p>
    </main>
</body>
</html>
