<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="/">
    <title>Lisselde_E - 项目主页</title>
    <meta name="description" content="Lisselde_E 的个人项目主页，包含 LANSyncBox、SyncGUI、DeskHelperGUI 等实用工具。">
    <link rel="icon" href="assets/images/icon/me.ico" type="image/x-icon">
    <script>
        // ========== 智能语言检测与路由 ==========
        // 优先级：?lang= 参数 > localStorage > 浏览器语言
        // 浏览器语言以 zh 开头 → 中文，否则 → 英文
        (function() {
            var path = window.location.pathname;
            var hash = window.location.hash;
            var search = window.location.search;
            var lang = '';

            // 1. URL 参数优先
            if (search.indexOf('lang=') !== -1) {
                var langMatch = search.match(/lang=([^&]+)/);
                if (langMatch) {
                    lang = langMatch[1];
                }
            }

            // 2. localStorage
            if (!lang) {
                lang = localStorage.getItem('site-lang') || '';
            }

            // 3. 浏览器语言检测
            if (!lang) {
                lang = (navigator.language || navigator.browserLanguage || '').toLowerCase();
                lang = lang.indexOf('zh') === 0 ? 'zh-cn' : 'en';
            }

            // 4. 子路径检测（覆盖）
            if (path.indexOf('/en/') === 0 || path === '/en') {
                lang = 'en';
            } else if (path.indexOf('/zh-cn/') === 0 || path === '/zh-cn') {
                lang = 'zh-cn';
            }

            // 保存语言偏好
            localStorage.setItem('site-lang', lang);

            // 重定向到对应语言目录
            var targetPath = lang === 'en' ? '/en/' : '/zh-cn/';
            var targetUrl = targetPath + (hash || '#0');
            // 如果当前 URL 参数中有 lang=，用 replaceState 优雅切换
            if (search.indexOf('lang=') !== -1) {
                history.replaceState(null, '', targetUrl);
            } else if (path.indexOf('/en/') !== 0 && path.indexOf('/zh-cn/') !== 0) {
                // 根路径 → 重定向到语言子目录
                window.location.replace(targetUrl);
            }
        })();
    </script>
</head>
<body>
    <p>正在检测语言偏好，即将跳转...</p>
</body>
</html>
